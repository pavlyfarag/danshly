name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Validate production compose
        run: |
          files="-f docker-compose.yml"
          if [ -f compose.homeops.yml ]; then files="$files -f compose.homeops.yml"; fi
          docker compose $files config --quiet --no-env-resolution
